</div>


<script>

    // ==========================================
    // TELEGRAM MINI APP
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==========================================
    // MONETAG / AD URL
    // ==========================================

    const AD_URL =
        "https://omg10.com/4/11731852";


    // ==========================================
    // ELEMENTS
    // ==========================================

    const watchButton =
        document.getElementById("watchButton");

    const status =
        document.getElementById("status");

    const adsWatched =
        document.getElementById("adsWatched");

    const reward =
        document.getElementById("reward");


    // ==========================================
    // LOCAL DISPLAY DATA
    // ==========================================

    let localAds =
        Number(
            localStorage.getItem("gw_ads_watched") || 0
        );

    function updateDisplay() {

        adsWatched.textContent =
            localAds;

        reward.textContent =
            "+" +
            (localAds * 0.33).toFixed(2) +
            "%";
    }

    updateDisplay();


    // ==========================================
    // WATCH AD
    // ==========================================

    watchButton.addEventListener(
        "click",
        function () {

            watchButton.disabled = true;

            watchButton.textContent =
                "📺 𝐎𝐩𝐞𝐧𝐢𝐧𝐠 𝐀𝐝...";

            status.style.display =
                "block";

            status.textContent =
                "📺 𝐎𝐩𝐞𝐧𝐢𝐧𝐠 𝐀𝐝𝐯𝐞𝐫𝐭𝐢𝐬𝐞𝐦𝐞𝐧𝐭...";


            // Open advertisement

            window.location.href =
                AD_URL;

        }
    );


    // ==========================================
    // BACK BUTTON
    // ==========================================

    tg.BackButton.show();

    tg.BackButton.onClick(
        function () {

            tg.close();

        }
    );

</script>
